[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "arcana-terminal"
version = "0.1.0"
description = "A small tarot ritual, held open in your terminal."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Arcana contributors"}]
dependencies = []

[project.scripts]
arcana = "arcana.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
